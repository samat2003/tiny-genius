# Stage 2 Tiny Transformer — debug model from the project plan.
# Not the frozen 300M training configuration.

name: tiny
stage: 2
frozen: false

n_layers: 4
d_model: 256
n_heads: 4
d_head: 64
d_ff: 640
vocab_size: 128
