    claimed_license: apache-2.0
    identity_status: verified
    hf_id: BAAI/TACO
    decision: reject
    block_reason: >
      REJECT this pass. License apache-2.0 is fine, but current huggingface
      `datasets` cannot load TACO.py dataset scripts, so the source is not
      fetchable. Not substituted.

  - source_id: apps
    domain: python
