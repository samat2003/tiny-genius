    identity_status: verified
    hf_id: codeparrot/apps
    decision: reject
    block_reason: >
      REJECT. Standard code-generation benchmark with imperfect tests; same
      dataset-script load failure as TACO; overlap with contest dumps.

  - source_id: tiny_python
