    claimed_url: "https://huggingface.co/datasets/deepmind/code_contests"
    claimed_license: cc-by-4.0
    identity_status: verified
    hf_id: deepmind/code_contests
    decision: reject
    identity_status_note: verified but rejected
    block_reason: >
      REJECT. CodeContests+ is built upon this dump. Using both would double-count
      the same contest problems. Remaining unique Python2 solutions are not wanted.

  - source_id: taco
