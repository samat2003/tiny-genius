# Math/STEM entries are unchanged from the prior authorized list.

sources:
  - source_id: codecontests_plus
    domain: python
    claimed_origin: "ByteDance-Seed/Code-Contests-Plus"
    claimed_url: "https://huggingface.co/datasets/ByteDance-Seed/Code-Contests-Plus"
    claimed_license: cc-by-4.0
    identity_status: verified
    hf_id: ByteDance-Seed/Code-Contests-Plus
